_target_: navsim.agents.transfuser.transfuser_agent.TransfuserAgent
_convert_: 'all'


config:
  _target_: navsim.agents.transfuser.transfuser_config.TransfuserConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  latent: False

  ## model name
  model_name: "W4D"  # W4D or LAW
  model_version: 8  # 2 or 3 or 4

  ## Soft responsibility (multi-modal supervision) settings
  soft_resp: false
  soft_resp_tau: 1.0
  soft_resp_topk: 0
  cls_entropy_weight: 0.1
  use_fde_for_weights: true

  ## world4drive config
  num_frames: 12
  num_mode: 4
  num_views: 3
  num_scene_query_token: 16
  traj_loss_weight: 1.0
  traj_cls_loss_weight: 0.0
  diversity_loss_weight: 0.0
  diversity_margin: 1.0  # 1m
  traj_cmd_loss_weight: 0.2
  use_cmd_embed: true
  use_wm: false
  wm_loss_weight: 0.2
  geometry_loss_weight: 0.1
  use_ar: false
  use_ar_wm: false
  action_chunk_size : 4
  ar_wm_replace_prob: 0.1
  _use_mlp_ensemble: false

  tf_d_model: 256
  tf_d_ffn: 1024
  tf_num_layers: 4
  tf_num_head: 8
  tf_dropout: 0.0

  dino_d_model: 384

  target_momentum: 0.999

  #epona config
  # closed_traj_evaluation: false

  ## grpo config
  training_mode: "sl"  # sl or ft
  ce_loss_weight: 0.1
  ade_best_traj_loss_weight: 0.1
  fde_best_traj_loss_weight: 0.1

  ## multi-modal trajectory vocab
  use_vocab_trajs: false
  vocab_trajs_dict_path: /mnt/parallel_ssd/home/zdhs0121/Driving/navsim_workspace/dataset/traj_pdm_v2/ori/navtrain_16384.pkl
  vocab_trajs_path: /mnt/parallel_ssd/home/zdhs0121/Driving/navsim_workspace/GTRS/traj_final/16384.npy

  cache_mode: false
  is_eval: false

  # Curriculum Learning 配置
  use_curriculum_learning: True        # 是否启用课程学习
  curriculum_start_epoch: 10             # 开始过渡的 epoch
  curriculum_end_epoch: 30               # 完成过渡的 epoch
  curriculum_start_step: 0               # 基于 step 的起始点（与 epoch 二选一，优先使用 step）
  curriculum_end_step: 0                 # 基于 step 的结束点
  curriculum_schedule: 'linear'          # 过渡策略: 'linear', 'cosine', 'step'

  # 分阶段 Loss 权重调度配置
  use_staged_loss: false
  staged_loss_schedule: 'linear'
  staged_wm_start_epoch: 0
  staged_wm_rampup_epochs: 5
  staged_geometry_decay_start_epoch: 5
  staged_geometry_decay_epochs: 10
  staged_geometry_final_weight: 0.1

lr: 1e-4
checkpoint_path: null

